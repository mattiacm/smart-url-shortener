name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1

      # - name: Debug - show shorten contents
      #   run: ls -la src/shorten/

      - name: Debug - verify src structure
        run: |
          ls -la src/shorten/
          ls -la src/shorten/src/ 2>/dev/null || echo "src/shorten/src NOT FOUND"

      - name: SAM Build and Deploy
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p src/shorten/src src/redirect/src src/analytics/src
          cp -r src/shared src/shorten/src/shared
          cp -r src/shared src/redirect/src/shared
          cp -r src/shared src/analytics/src/shared
          sam build --template template.yaml --no-cached
          sam deploy \
            --template .aws-sam/build/template.yaml \
            --stack-name smart-url-shortener \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region eu-south-1 \
            --s3-bucket smart-url-shortener-deploy-mattiacm